name: Bug report
description: Report a reproducible problem in codex-cliner.
title: '[Bug]: '
labels:
    - bug
    - triage
body:
    - type: markdown
      attributes:
          value: |
              Thanks for reporting this.

              Use this form for product bugs, regressions, and incorrect behavior.

              Do not use public issues for vulnerabilities, destructive path traversal, or exploit details. Report security issues privately to `gdhdev@protonmail.com`.
    - type: input
      id: contact
      attributes:
          label: Contact details
          description: How can we reach you if we need more detail?
          placeholder: name@example.com
      validations:
          required: false
    - type: input
      id: version
      attributes:
          label: codex-cliner version
          description: What version are you running?
          placeholder: 0.1.0
      validations:
          required: true
    - type: input
      id: platform
      attributes:
          label: Platform
          description: Operating system and shell/runtime details.
          placeholder: macOS 15.4, Bun 1.3.11, Node 20
      validations:
          required: true
    - type: dropdown
      id: area
      attributes:
          label: Affected area
          description: Which surface is failing?
          options:
              - Interactive UI
              - Session scanning
              - Archived session cleanup
              - Stale index cleanup
              - Backup creation
              - Restore
              - Config and Codex home detection
              - Packaging or install
              - Documentation
              - Other
      validations:
          required: true
    - type: textarea
      id: what_happened
      attributes:
          label: What happened?
          description: Describe the actual behavior and the expected behavior.
          placeholder: Describe the bug, the expected result, and why the current result is wrong.
      validations:
          required: true
    - type: textarea
      id: reproduction
      attributes:
          label: Reproduction steps
          description: Provide the smallest reliable set of steps that reproduces the issue.
          placeholder: |
              1. Run `codex-cliner ...`
              2. Open ...
              3. Confirm ...
              4. Observe ...
      validations:
          required: true
    - type: textarea
      id: codex_layout
      attributes:
          label: Codex storage context
          description: Describe the relevant local setup without pasting sensitive data.
          placeholder: |
              - Codex home path style
              - Whether sessions or archived sessions were present
              - Whether the issue involved backups or restore
      validations:
          required: false
    - type: textarea
      id: logs
      attributes:
          label: Relevant logs or output
          description: Paste terminal output, stack traces, or error messages.
          render: shell
      validations:
          required: false
    - type: checkboxes
      id: checks
      attributes:
          label: Confirmation
          options:
              - label: I checked that this is not a private security issue or exploit report.
                required: true
              - label: I can reproduce this on the version listed above.
                required: true
              - label: I agree to follow this project's Code of Conduct.
                required: true
