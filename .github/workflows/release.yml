name: Release

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: Validate the release without publishing to npm
                required: true
                default: true
                type: boolean
    push:
        tags:
            - 'v*'

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org

            - name: Restore Bun cache
              uses: actions/cache@v5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock', 'package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-cache-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Read package version
              id: package
              run: |
                  VERSION="$(node -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')"
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"

            - name: Validate tag matches package version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION="${{ steps.package.outputs.version }}"
                  if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
                    exit 1
                  fi

            - name: Validate release
              run: |
                  bun run release:check
                  bun run typecheck
                  bun run lint
                  bun run test
                  bun run build
                  bun run package:check

            - name: Release checklist summary
              run: |
                  {
                    echo "## Release checklist"
                    echo "- package.json version: ${{ steps.package.outputs.version }}"
                    echo "- validation suite: passed"
                    echo "- npmjs publish target: codex-cliner"
                    echo "- GitHub Packages target: @${GITHUB_REPOSITORY_OWNER,,}/codex-cliner"
                    echo "- tag/version alignment: checked on tag-triggered runs"
                    echo "- dry run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Publish to npm
              if: github.event_name == 'push' || inputs.dry_run == false
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Prepare the GitHub Packages artefact
              if: github.event_name == 'push' || inputs.dry_run == false
              run: |
                  rm -rf .release/github-package
                  mkdir -p .release/github-package
                  cp -R dist .release/github-package/dist
                  cp README.md LICENSE .release/github-package/
                  cp package.json .release/github-package/package.json
                  OWNER_LOWER="${GITHUB_REPOSITORY_OWNER,,}"
                  node -e '
                  const fs = require("node:fs");
                  const path = ".release/github-package/package.json";
                  const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
                  pkg.name = `@${process.env.OWNER_LOWER}/${pkg.name}`;
                  pkg.publishConfig = { registry: "https://npm.pkg.github.com" };
                  fs.writeFileSync(path, `${JSON.stringify(pkg, null, 4)}\n`);
                  '
              env:
                  OWNER_LOWER: ${{ github.repository_owner }}

            - name: Setup Node for GitHub Packages
              if: github.event_name == 'push' || inputs.dry_run == false
              uses: actions/setup-node@v5
              with:
                  node-version: 20
                  registry-url: https://npm.pkg.github.com
                  scope: '@gabrielhamalwa'

            - name: Publish to GitHub Packages
              if: github.event_name == 'push' || inputs.dry_run == false
              run: npm publish
              working-directory: .release/github-package
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
