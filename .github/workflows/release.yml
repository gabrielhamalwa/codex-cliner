name: Release

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: Validate the release without publishing to npm
                required: true
                default: true
                type: boolean
    push:
        tags:
            - 'v*'

concurrency:
    group: release-${{ github.ref }}
    cancel-in-progress: false

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  registry-url: https://registry.npmjs.org

            - name: Restore Bun cache
              uses: actions/cache@v4
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock', 'package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-cache-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Read package version
              id: package
              run: echo "version=$(node -p \"require('./package.json').version\")" >> "$GITHUB_OUTPUT"

            - name: Validate tag matches package version
              if: startsWith(github.ref, 'refs/tags/')
              run: |
                  TAG_VERSION="${GITHUB_REF_NAME#v}"
                  PACKAGE_VERSION="${{ steps.package.outputs.version }}"
                  if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
                    echo "Tag version $TAG_VERSION does not match package.json version $PACKAGE_VERSION" >&2
                    exit 1
                  fi

            - name: Validate release
              run: |
                  bun run release:check
                  bun run typecheck
                  bun run lint
                  bun run test
                  bun run build
                  bun run package:check

            - name: Release checklist summary
              run: |
                  {
                    echo "## Release checklist"
                    echo "- package.json version: ${{ steps.package.outputs.version }}"
                    echo "- validation suite: passed"
                    echo "- npm token configured: required for publish step"
                    echo "- tag/version alignment: checked on tag-triggered runs"
                    echo "- dry run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}"
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Publish to npm
              if: github.event_name == 'push' || inputs.dry_run == false
              run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
