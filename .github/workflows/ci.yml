name: CI

on:
    push:
        branches:
            - main
            - 'codex/**'
    pull_request:

permissions:
    contents: read

jobs:
    validate:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v5

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.11

            - name: Setup Node
              uses: actions/setup-node@v5
              with:
                  node-version: 20

            - name: Restore Bun cache
              uses: actions/cache@v5
              with:
                  path: ~/.bun/install/cache
                  key: ${{ runner.os }}-bun-cache-${{ hashFiles('bun.lock', 'package.json') }}
                  restore-keys: |
                      ${{ runner.os }}-bun-cache-

            - name: Install dependencies
              run: bun install --frozen-lockfile

            - name: Format check
              run: bun run format:check

            - name: Typecheck
              run: bun run typecheck

            - name: Lint
              run: bun run lint

            - name: Security check
              run: bun run security:check

            - name: Test
              run: bun run test

            - name: Build
              run: bun run build

            - name: Package check
              run: bun run package:check
